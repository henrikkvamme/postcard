# The postcard site: static files only. site/serve.py serves the same layout for development.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  types {
    model/gltf-binary glb;
    application/geo+json geojson;
    text/markdown md;
    text/plain txt py;
    application/gzip gz;
  }
  include /etc/nginx/mime.types;
  charset utf-8;
  charset_types text/plain text/markdown text/css application/javascript application/json application/geo+json;

  gzip on;
  gzip_types text/plain text/markdown text/css application/javascript application/json application/geo+json image/svg+xml model/gltf-binary;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Kit pages ask for a local checkout server every 5 s; 204 is "no booking" and keeps the console clean.
  location = /api/checkout/latest { return 204; }
  location /api/ { return 404; }


  location /kit/art/ { expires 7d; add_header Cache-Control "public"; add_header X-Content-Type-Options nosniff always; }
  location ~* \.(html|txt|md|js|css|json)$ { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
  location / { try_files $uri $uri/ =404; }
}
