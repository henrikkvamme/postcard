<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The trip is untrusted data: scripts come only from this site and pinned unpkg builds. MapLibre starts its
     worker from a blob. Tiles, terrain and the trip URL can be anywhere, so connect-src and img-src are open. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; worker-src 'self' blob:; child-src blob:; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src * data: blob:; connect-src * data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Postcard viewer</title>
<link rel="icon" href="/kit/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/deck.gl@9.4.0/dist.min.js"></script>
<link rel="stylesheet" href="/kit/kit.css">
<link rel="stylesheet" href="/view/view.css">
</head>
<body class="intro">
<div id="map" class="pc-map"></div>
<div id="stripes" class="pc-stripes"></div>

<!-- Empty, loading and error: one card on the paper. -->
<section class="open pc-card" id="open" aria-labelledby="open-h">
  <div class="pc-eyebrow">Postcard viewer</div>
  <h1 id="open-h">Open a trip</h1>
  <p class="lead">Drop a <code>trip.json</code> here, or the folder that holds it and its <code>paths/</code>.</p>
  <div class="acts">
    <label class="btn primary"><input type="file" id="file" accept=".json,application/json,.geojson" multiple hidden>Choose a file</label>
    <label class="btn"><input type="file" id="folder" webkitdirectory hidden>Choose a folder</label>
  </div>
  <form class="url" id="urlform">
    <input id="url" type="url" inputmode="url" placeholder="https://… /trip.json" aria-label="Link to a trip.json" autocomplete="off" spellcheck="false">
    <button class="btn" type="submit">Open</button>
  </form>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <p class="fine">The map draws on your device. The trip is not sent to this site. <a href="#trip=/nordic/trip.json" id="example">Open an example</a></p>
</section>

<!-- The trip: one card, the legs, the book band. -->
<aside class="hud pc-card pc-hud" id="card" hidden aria-label="Trip">
  <header class="hd">
    <div class="pc-eyebrow" id="seen"></div>
    <h1 id="title"></h1>
    <div class="sub" id="sub"></div>
    <div class="ctl" id="ctl"></div>
  </header>
  <div class="legs" id="legs"></div>
  <button class="pc-book" id="book" type="button"><span id="book-l">Book</span><b id="book-p"></b></button>
</aside>

<div class="dropzone" id="dropzone" hidden><div>Drop to open this trip</div></div>
<script type="module" src="/view/view.js"></script>
</body>
</html>
