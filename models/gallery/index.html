<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model gallery</title>
<script src="https://unpkg.com/deck.gl@9.4.0/dist.min.js"></script>
<style>
  :root { --paper: #f4f2ea; --ink: #1d2a4a; --ink2: #4f5a74; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font: 13px/1.4 Inter, -apple-system, system-ui, sans-serif; }
  #deck { position: fixed; inset: 0; }
  #names { position: fixed; inset: 0; pointer-events: none; }
  #names span { position: absolute; transform: translate(-50%, 0); white-space: nowrap; color: var(--ink2); }
  #bar { position: fixed; left: 16px; top: 12px; display: flex; gap: 8px; align-items: center; }
  button { font: inherit; color: var(--ink); background: #fbfaf5; border: 1px solid rgba(29,42,74,.22); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
</style>
</head>
<body>
<div id="deck"></div>
<div id="names"></div>
<div id="bar"><button id="spin">Pause turn</button><span id="info"></span></div>
<script type="module">
// Every model on a turntable, drawn with the same deck.gl ScenegraphLayer the map uses.
// ?only=name,name shows a few; ?kind=vehicle or landmark filters.
const q = new URLSearchParams(location.search);
const BASE = '../../plugins/postcard/skills/postcard/kit/art/3d/';
let list = await fetch(BASE + 'index.json').then((r) => r.json()).catch(() => []);
if (q.get('only')) { const o = q.get('only').split(','); list = o.map((n) => list.find((m) => m.name === n) || { name: n }); }
if (q.get('kind')) list = list.filter((m) => m.kind === q.get('kind'));
const cols = Math.min(list.length, Math.ceil(Math.sqrt(list.length * 1.6))), CELL = q.has('map') ? 130 : 70;
const cells = list.map((m, i) => ({ ...m, x: (i % cols - (cols - 1) / 2) * CELL, y: -(Math.floor(i / cols) - (Math.ceil(list.length / cols) - 1) / 2) * CELL * .8,
  // Each model fills about 40 m of its cell, whatever its true size.
  s: 40 / Math.max(1, ...(m.size || [10, 10, 10])) }));
// ?map: each model at its map size (meta.px, default 56) at zoom 0, where one unit is one pixel.
if (q.has('map')) for (const m of cells) m.s = (m.px || 56) / Math.max(1, ...(m.size || [10, 10, 10]));
let angle = 30, spin = true;
const rows = Math.ceil(list.length / cols);
const deckgl = new deck.Deck({
  parent: document.getElementById('deck'),
  views: new deck.OrbitView({ orbitAxis: 'Z', fovy: 30 }),
  initialViewState: { target: [0, 0, 4], rotationX: 28, rotationOrbit: 20, zoom: q.has('zoom') ? +q.get('zoom') : Math.log2(Math.min(innerWidth / (cols * CELL), innerHeight / (rows * CELL * .8))) - 1.2, minZoom: -4, maxZoom: 8 },
  controller: true, width: innerWidth, height: innerHeight, deviceProps: { webgl: { preserveDrawingBuffer: true } },
  layers: [],
  onAfterRender: names,
});
function layers() {
  const dots = q.has('debug') ? [new deck.ScatterplotLayer({ id: 'o', data: cells, coordinateSystem: deck.COORDINATE_SYSTEM.CARTESIAN, getPosition: (d) => [d.x, d.y, 0], getRadius: 1, getFillColor: [255, 0, 0] })] : [];
  return [...dots, ...cells.map((m) => new deck.ScenegraphLayer({
    id: m.name, data: [m], scenegraph: BASE + m.name + '.glb', coordinateSystem: deck.COORDINATE_SYSTEM.CARTESIAN,
    getPosition: (d) => [d.x, d.y, 0], sizeScale: m.s, getOrientation: [0, angle, 90], _lighting: q.get('light') || 'pbr',
    getColor: [255, 255, 255, 255], updateTriggers: { getOrientation: angle },
  }))];
}
function names() {
  const vp = deckgl.getViewports()[0]; if (!vp) return; window.__vp = { w: vp.width, h: vp.height, z: vp.zoom, o: vp.project([0, 0, 0]), t: vp.target, id: vp.id };
  document.getElementById('names').innerHTML = cells.map((m) => { const [x, y] = vp.project([m.x, m.y - CELL * .3, 0]);
    return `<span style="left:${x}px;top:${y}px">${m.name}</span>`; }).join('');
}
function tick() { if (spin) angle = (angle + .4) % 360; deckgl.setProps({ layers: layers() }); requestAnimationFrame(tick); }
document.getElementById('spin').onclick = (e) => { spin = !spin; e.target.textContent = spin ? 'Pause turn' : 'Turn'; };
document.getElementById('info').textContent = `${list.length} models`;
window.__gallery = { deck: deckgl, shot: () => { deckgl.setProps({ layers: layers() }); deckgl.redraw('shot'); return deckgl.getCanvas().toDataURL('image/png'); }, set: (a) => { spin = false; angle = a; } };
addEventListener('resize', () => deckgl.setProps({ width: innerWidth, height: innerHeight }));
tick();
</script>
</body>
</html>
