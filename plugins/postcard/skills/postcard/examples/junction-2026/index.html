<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postcard</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@400;500;600&family=Caveat:wght@500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/deck.gl@9.4.0/dist.min.js"></script>
<link rel="stylesheet" href="/kit/kit.css">
<style>
  /* One card in the corner. Step 1 is the postcard; step 2 opens the card to the left with four views. */
  .hc { position: fixed; right: 30px; bottom: 30px; width: 440px; z-index: 10; display: grid; grid-template-columns: minmax(0, 1fr) auto 440px; transform: rotate(-.6deg); --d: .35s; }
  .hc.open { width: calc(100% - 60px); height: 420px; transform: none; }
  .hc > .details, .hc > .vrule { display: none; }
  .hc.open > .details { display: grid; } .hc.open > .vrule { display: block; width: 1px; background: var(--rule2); margin: 20px 0 22px; }
  .postcard { grid-column: 3; display: grid; grid-template-columns: minmax(0, 1fr) 1px 156px; gap: 0 16px; padding: 18px 20px 0; }
  .postcard .rule { background: var(--rule2); }
  .postcard .pick { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; margin: -2px 0 10px; }
  .steps { flex: 1; display: flex; align-items: center; gap: 8px; }
  .stp { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; font: 600 10px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .stp i { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font: 600 10px/1 var(--sans); font-style: normal; box-shadow: inset 0 0 0 1.2px currentColor; }
  .stp:hover { color: var(--ink); } .stp[aria-current="step"] { color: var(--ink); cursor: default; } .stp[aria-current="step"] i { background: var(--ink); color: var(--card); box-shadow: none; }
  .steps .ln { width: 16px; height: 1px; background: var(--rule); }
  .dots { display: flex; gap: 6px; }
  .dots button { all: unset; cursor: pointer; width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1.2px var(--muted); }
  .dots button[aria-pressed="true"] { background: var(--red); box-shadow: none; }
  .step { all: unset; cursor: pointer; width: 24px; height: 24px; display: grid; place-items: center; border-radius: var(--r); color: var(--ink2); font: 600 15px var(--sans); }
  .step:hover { background: rgba(29, 42, 74, .06); color: var(--ink); } .step[disabled] { opacity: .3; cursor: default; background: none; }
  .info .pc-price { margin: 2px 0 8px; }
  .leg { display: grid; grid-template-columns: 38px 1fr; font-size: 12px; color: var(--ink2); line-height: 1.6; }
  .leg b { font: 600 10px var(--sans); letter-spacing: .16em; text-transform: uppercase; padding-top: 3px; color: var(--ink); }
  .leg em { font: italic 400 15px var(--serif); color: var(--ink); }
  .meters { display: grid; gap: 9px; margin-top: 12px; }
  .meter { display: grid; grid-template-columns: 58px 1fr 52px; align-items: center; font-size: 12px; color: var(--ink2); }
  .meter > span:last-child { text-align: right; color: var(--ink); font-weight: 600; }
  .hours { display: flex; gap: 4px; } .hours .pc-cells { width: 31px; } .hours .pc-cells i { width: 3px; height: 9px; }
  .moments { display: flex; gap: 7px; } .moments i { width: 8px; height: 8px; transform: rotate(45deg); background: var(--ink); } .moments i.off { background: transparent; box-shadow: inset 0 0 0 1.1px var(--red); }
  .addr { display: flex; flex-direction: column; } .addr .lines { margin-top: auto; } .addr .lines div { border-bottom: 1px solid var(--rule2); padding: 6px 0 2px; }
  .ctl { display: none; grid-column: 1 / -1; }
  .pc-chips .sep { width: 1px; margin: 4px; background: var(--rule2); }
  .postcard .pc-book { grid-column: 1 / -1; margin: 16px -20px 0; border-radius: 0 0 var(--r) var(--r); }
  .hc.open .postcard { height: 100%; grid-template-rows: auto auto auto 1fr; }
  .hc.open .ctl { display: block; margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--rule); }
  .hc.open .postcard .pc-book { align-self: end; border-bottom-left-radius: 0; }
  .details { grid-column: 1; min-width: 0; overflow: hidden; grid-template-rows: auto minmax(0, 1fr); padding: 16px 20px 16px 24px; }
  .dhead { display: flex; align-items: center; gap: 12px; margin: -2px 0 10px; }
  .tabs { flex: 1; display: flex; gap: 22px; border-bottom: 1px solid var(--rule2); }
  .tabs button { all: unset; cursor: pointer; padding: 6px 0 7px; margin-bottom: -1px; border-bottom: 1.5px solid transparent; font: 600 10px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .tabs button:hover { color: var(--ink2); } .tabs button[aria-pressed="true"] { color: var(--ink); border-color: var(--red); }
  .close2 { all: unset; cursor: pointer; width: 26px; height: 26px; display: grid; place-items: center; border-radius: var(--r); color: var(--ink2); }
  .close2:hover { background: rgba(29, 42, 74, .06); }
  .views { position: relative; min-height: 0; } .views > .view { position: absolute; inset: 0; width: 100%; height: 100%; } .view.off { display: none !important; }
  .views svg { overflow: visible; }
  .readnote { font: 12px/1.45 var(--sans); color: var(--ink2); } .readnote p { margin: 6px 0 0; } .pc-caps-h { font: 600 10px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--ink); }
  .red { color: var(--red); }
  #v-sellers { display: grid; grid-template-rows: auto 1fr; }
  #v-sellers .head { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--muted); padding: 0 0 6px; border-bottom: 1px solid var(--rule2); }
  .srow { display: grid; grid-template-columns: 150px 1fr 330px; gap: 18px; align-items: center; padding: 4px 0; border-bottom: 1px dashed var(--rule2); }
  .srow .who b { display: block; font: 600 10px var(--sans); letter-spacing: .16em; color: var(--ink); } .srow .who em { font: italic 400 15px var(--serif); } .srow .who span { display: block; font-size: 12px; color: var(--ink2); }
  .srow svg { width: 100%; height: 76px; } .srow .why { font-size: 12px; line-height: 1.45; color: var(--ink2); } .srow .why b { color: var(--ink); font-weight: 600; }
  #v-story { display: grid; grid-template-rows: 1fr auto; }
  .stations { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; align-items: start; padding-top: 38px; }
  .stations::before { content: ""; position: absolute; left: 0; right: 0; top: 49px; border-top: 1.5px solid var(--ink); }
  .st { position: relative; padding: 22px 8px 0 0; }
  .st::before { content: ""; position: absolute; left: 0; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--card); border: 1.5px solid var(--ink); }
  .st.fly::before { background: var(--red); border-color: var(--red); } .st.warn::before { border-color: var(--red); box-shadow: 0 0 0 3px rgba(184, 50, 42, .18); }
  .st .gap { position: absolute; left: 14px; top: -14px; font: 600 10px var(--sans); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; white-space: nowrap; }
  .st .day { font: 600 10px var(--sans); letter-spacing: .16em; color: var(--muted); } .st .tm { font: 600 21px/1.1 var(--serif); } .st .tz { font: 500 10px var(--sans); color: var(--muted); margin-left: 3px; }
  .st .ti { font: italic 400 15px/1.25 var(--serif); margin-top: 3px; } .st .sb { font-size: 12px; color: var(--ink2); margin-top: 2px; line-height: 1.35; }
  .st.event { background: repeating-linear-gradient(-45deg, rgba(184, 50, 42, .07) 0 3px, transparent 3px 6px); margin-top: -8px; padding-top: 30px; }
  #v-story .foot { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 12px; color: var(--ink2); border-top: 1px solid var(--rule2); padding-top: 7px; } #v-story .foot b { color: var(--ink); }
  .seg.plane { rx: 1.5; }
  /* Phone: the postcard docks at the bottom; step 2 takes the lower two thirds and its views scroll sideways. */
  @media (max-width: 760px) {
    .pc-title { left: 20px; top: 20px; } .pc-title h1 { font-size: 30px; }
    .hc { left: 10px; right: 10px; bottom: 10px; width: auto; grid-template-columns: 1fr; transform: none; }
    .hc.open { width: auto; height: 62vh; grid-template-rows: minmax(0, 1fr) auto; }
    .postcard { grid-column: 1; grid-template-columns: minmax(0, 1fr) 1px 120px; padding: 14px 14px 0; }
    .postcard .pc-book { margin: 12px -14px 0; } .addr svg { transform: scale(.75); transform-origin: top left; }
    .hc.open > .details { grid-row: 1; padding: 12px; } .hc.open > .vrule { display: none; } .hc.open .postcard { grid-row: 2; height: auto; } .hc.open .postcard .info, .hc.open .postcard .rule, .hc.open .postcard .addr { display: none; }
    .views { overflow-x: auto; } .views > .view { min-width: 720px; } .tabs { gap: 14px; overflow-x: auto; }
  }
</style>
</head>
<body class="intro">
<div id="map" class="pc-map"></div>
<div class="pc-stripes" id="stripes"></div>
<div class="pc-title pc-halo pc-hud"><h1 id="t-h1"></h1><div class="sub" id="t-sub"></div></div>
<div class="pc-card hc pc-hud" id="hc">
  <div class="details">
    <div class="dhead"><div class="tabs" id="tabs"></div><button class="close2" id="close2" title="Back to the preview" aria-label="Back to the preview">⌄</button></div>
    <div class="views"><svg id="v-timeline" class="view" data-v="timeline"></svg><svg id="v-trade" class="view off" data-v="trade"></svg>
      <div id="v-sellers" class="view off" data-v="sellers"></div><div id="v-story" class="view off" data-v="story"></div></div>
  </div>
  <div class="vrule"></div>
  <div class="postcard" id="postcard"></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
