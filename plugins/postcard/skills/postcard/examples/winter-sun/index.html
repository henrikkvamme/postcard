<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postcard</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@400;500;600&family=Caveat:wght@500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/deck.gl@9.4.0/dist.min.js"></script>
<link rel="stylesheet" href="/kit/kit.css">
<style>
  /* One wide card at the bottom: the grid of places and weeks on the left, the chosen holiday as a postcard on the right. */
  .card { position: fixed; left: 30px; right: 30px; bottom: 30px; height: 372px; z-index: 10; display: grid; grid-template-columns: minmax(0, 1fr) 1px 420px; }
  .card > .vrule { background: var(--rule2); margin: 20px 0; }
  .left { display: grid; grid-template-rows: auto minmax(0, 1fr); padding: 16px 20px 14px 24px; min-width: 0; }
  .dhead { display: flex; align-items: flex-end; gap: 16px; border-bottom: 1px solid var(--rule2); margin-bottom: 12px; }
  .tabs { display: flex; gap: 22px; flex: none; white-space: nowrap; }
  .tabs button { all: unset; cursor: pointer; padding: 6px 0 7px; margin-bottom: -1px; border-bottom: 1.5px solid transparent; font: 600 10px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .tabs button:hover { color: var(--ink2); } .tabs button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
  #ctl { margin-left: auto; display: flex; gap: 6px 14px; flex-wrap: wrap; justify-content: flex-end; padding-bottom: 6px; }
  #ctl .pc-chips + .pc-chips { margin-top: 0; padding-left: 14px; border-left: 1px solid var(--rule2); }
  .views { position: relative; min-height: 0; } .view { position: absolute; inset: 0; width: 100%; height: 100%; } .view.off { display: none !important; }
  .views svg { overflow: visible; }
  table.grid { width: 100%; border-collapse: collapse; table-layout: fixed; } .grid col.name { width: 24%; } .grid col.t { width: 10%; }
  .grid th, .grid td { padding: 4px 4px; text-align: left; font-weight: 400; }
  .grid thead th { font: 500 12px var(--sans); color: var(--muted); border-bottom: 1px solid var(--rule2); } .grid thead b { color: var(--ink); font-weight: 600; }
  .grid tbody th b { display: block; font: 600 15px var(--serif); } .grid tbody th span { font-size: 12px; color: var(--ink2); }
  .grid tbody tr + tr > * { border-top: 1px dashed var(--rule2); }
  .grid .num { text-align: right; } .grid .temp { font: 600 21px var(--serif); color: var(--ink); padding-right: 18px; }
  .grid .none { color: var(--muted); padding-left: 14px; }
  .cell { all: unset; cursor: pointer; display: grid; box-sizing: border-box; width: 100%; padding: 5px 10px 9px; border-radius: var(--r); position: relative; overflow: hidden;
    box-shadow: inset 0 0 0 1px var(--rule2); }
  .cell::after { content: ""; position: absolute; left: 10px; bottom: 4px; height: 2px; width: calc((100% - 20px) * var(--w) / 100); background: var(--ink); opacity: .22; border-radius: 1px; }
  .cell[aria-pressed="true"]::after { background: var(--red); opacity: .6; }
  .cell:hover { box-shadow: inset 0 0 0 1px var(--rule); } .cell:focus-visible { outline: 2px solid var(--ink); }
  .cell[aria-pressed="true"] { box-shadow: inset 0 0 0 1.5px var(--red); }
  .cell b { font: 600 15px var(--serif); } .cell[aria-pressed="true"] b { color: var(--red); }
  .cell i { position: absolute; right: 10px; top: 8px; font: 500 10px var(--sans); color: var(--muted); font-style: normal; }
  .cell span { font-size: 12px; color: var(--ink2); }
  #v-weeks { overflow: auto; } #v-weeks .foot { margin: 10px 0 0; font-size: 12px; color: var(--muted); line-height: 1.45; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .postcard { display: grid; grid-template-columns: minmax(0, 1fr) 150px; grid-template-rows: 1fr auto; gap: 0 14px; padding: 18px 20px 0; }
  .postcard h2 { margin: 2px 0 0; font: 700 34px/1.05 var(--serif); display: flex; align-items: baseline; gap: 10px; }
  .postcard h2 span { font: 600 21px var(--serif); color: var(--ink); }
  .postcard .pc-price { font-size: 21px; margin: 6px 0 8px; } .postcard .pc-price sup { font: 500 12px var(--sans); color: var(--muted); margin-left: 4px; }
  .leg { display: grid; grid-template-columns: 38px 1fr; font-size: 12px; color: var(--ink2); line-height: 1.5; }
  .leg b { font: 600 10px var(--sans); letter-spacing: .16em; text-transform: uppercase; padding-top: 3px; color: var(--ink); } .leg em { font: italic 400 15px var(--serif); color: var(--ink); }
  .facts { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; font-size: 12px; color: var(--ink2); } .facts b { color: var(--ink); font-weight: 600; }
  .red { color: var(--red); }
  .addr { display: flex; flex-direction: column; } .addr .lines { margin-top: auto; padding-bottom: 4px; } .addr .lines div { border-bottom: 1px solid var(--rule2); padding: 6px 0 2px; font-size: 21px; }
  .postcard .pc-book { grid-column: 1 / -1; margin: 12px -20px 0; border-radius: 0 0 var(--r) 0; }
  .empty { grid-column: 1 / -1; color: var(--ink2); }
  @media (max-width: 960px) {
    .card { left: 10px; right: 10px; bottom: 10px; height: auto; max-height: none; grid-template-columns: minmax(0, 1fr); grid-template-rows: 292px auto; }
    .card > .vrule { display: none; } .left { min-height: 0; padding: 10px 12px 8px; } #v-weeks { overflow: auto; } .dhead { flex-wrap: wrap; } #ctl { margin-left: 0; justify-content: flex-start; flex-wrap: nowrap; overflow-x: auto; max-width: 100%; } #ctl .pc-chips { flex-wrap: nowrap; flex: none; }
    /* A phone keeps the facts and drops the stamps: they repeat the dates and the temperature. */
    .postcard { border-top: 1px solid var(--rule2); grid-template-columns: minmax(0, 1fr); padding-top: 12px; } .addr { display: none; }
    .postcard h2 { font-size: 30px; } .postcard .pc-price { margin: 2px 0 6px; } .facts { margin-top: 6px; }
    .left { grid-template-columns: minmax(0, 1fr); } .dhead { min-width: 0; }
    .postcard .pc-book { border-radius: 0 0 var(--r) var(--r); } .pc-title { left: 20px; top: 20px; } .pc-title h1 { font-size: 30px; }
    #v-flights { min-width: 720px; } .views { overflow-x: auto; }
    #ctl .pc-chips + .pc-chips { padding-left: 0; border-left: 0; } .grid tbody th span { display: none; } .grid col.name { width: 26%; } .grid col.t { width: 13%; }
    .grid tbody th b { font-size: 15px; } .grid .temp { font-size: 15px; padding-right: 6px; } .cell { padding: 3px 6px 7px; } .cell b { font-size: 12px; white-space: nowrap; } .cell span { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .dhead { margin-bottom: 6px; } .cell .ap { display: none; } .grid th, .grid td { padding: 3px 3px; }
  }
</style>
</head>
<body class="intro">
<div id="map" class="pc-map"></div>
<div class="pc-stripes" id="stripes"></div>
<div class="pc-title pc-halo pc-hud"><h1 id="t-h1"></h1><div class="sub" id="t-sub"></div></div>
<div class="pc-card card pc-hud" id="card" style="--d:.35s">
  <div class="left">
    <div class="dhead"><div class="tabs" id="tabs"></div><div id="ctl" class="pc-scroll-x"></div></div>
    <div class="views"><div id="v-weeks" class="view" data-v="weeks"></div><svg id="v-flights" class="view off" data-v="flights"></svg></div>
  </div>
  <div class="vrule"></div>
  <div class="postcard" id="postcard"></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
