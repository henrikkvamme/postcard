<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postcard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@400;500;600&family=Caveat:wght@500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/deck.gl@9.4.0/dist.min.js"></script>
<style>
  :root {
    --paper: #f4f2ea; --land: #f8f6ef; --card: #fbfaf5; --ink: #1d2a4a; --ink2: #4f5a74; --muted: #8d93a3;
    --rule: rgba(29, 42, 74, .22); --rule2: rgba(29, 42, 74, .1); --red: #b8322a;
    --serif: Fraunces, Georgia, serif; --sans: Inter, -apple-system, system-ui, sans-serif; --hand: Caveat, cursive;
    --r: 4px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); color: var(--ink); font: 13px/1.35 var(--sans); font-variant-numeric: tabular-nums; overflow: hidden; }
  button { font: inherit; color: inherit; }

  .frame { position: fixed; inset: 0; padding: 10px;
    background: repeating-linear-gradient(-45deg, var(--red) 0 16px, var(--paper) 16px 24px, var(--ink) 24px 40px, var(--paper) 40px 48px); }
  .sheet { position: relative; height: 100%; background: var(--paper); border-radius: 3px; overflow: hidden; }
  #map { z-index: 0; isolation: isolate; }
  .title, #trips, .postcard, .ledger, .reset { z-index: 10; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #map:active { cursor: grabbing; }
  .lbl { pointer-events: none; font: 600 9.5px var(--serif); letter-spacing: .34em; color: var(--ink); text-shadow: 0 0 3px var(--land), 0 0 6px var(--land); white-space: nowrap; }
  .lbl.sea { font: italic 400 16px var(--serif); letter-spacing: .14em; text-shadow: 0 0 3px var(--paper), 0 0 6px var(--paper), 0 0 9px var(--paper); }
  .lbl.city { font: 600 21px var(--serif); letter-spacing: 0; text-shadow: 0 0 3px var(--land), 0 0 5px var(--land), 0 0 9px var(--land); }
  .lbl.hub { font: 600 9px var(--sans); letter-spacing: .12em; }
  .dot { width: 15px; height: 15px; border-radius: 50%; background: var(--land); border: 1.5px solid var(--ink); display: grid; place-items: center; pointer-events: none; }
  .dot::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--ink); }
  .hubdot { width: 7px; height: 7px; border-radius: 50%; background: var(--land); border: 1.1px solid var(--ink); pointer-events: none; }
  .hubdot.on { background: var(--red); border-color: var(--red); }
  .z-far .lbl, .z-far .hubdot, .z-far .dot { visibility: hidden !important; }
  .z-mid .lbl:not(.city):not(.sea), .z-mid .hubdot { visibility: hidden !important; }
  .z-city .lbl, .z-city .hubdot { visibility: hidden !important; }
  .maplibregl-ctrl-attrib { font-size: 10px; background: rgba(251, 250, 245, .8) !important; }
  .reset { all: unset; position: absolute; right: 30px; bottom: 302px; cursor: pointer; display: flex; gap: 8px; align-items: center;
    padding: 6px 10px; background: var(--card); border: 1px solid var(--rule); border-radius: var(--r); font: 500 12px var(--sans); color: var(--ink2); }
  .reset:hover { color: var(--ink); }
  .reset kbd { font: 600 10px var(--sans); border: 1px solid var(--rule); border-radius: 2px; padding: 0 4px; color: var(--muted); }
  .reset[hidden] { display: none; }

  /* One surface for everything that floats on the chart: paper card, hairline ink rule, inner second rule. */
  .card { background: var(--card); border: 1px solid var(--rule); border-radius: var(--r); position: absolute;
    box-shadow: 0 1px 0 rgba(0, 0, 0, .03), 0 12px 26px -18px rgba(20, 30, 50, .5); }
  .card::after { content: ""; position: absolute; inset: 4px; border: 1px solid var(--rule2); border-radius: 2px; pointer-events: none; }
  .eyebrow { font: 600 9.5px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .halo { text-shadow: 0 0 3px var(--paper), 0 0 6px var(--paper), 0 0 10px var(--paper); }

  .title { position: absolute; left: 36px; top: 28px; pointer-events: none; }
  .title h1 { margin: 0; font: 700 42px/1 var(--serif); letter-spacing: -.015em; }
  .title .sub { margin-top: 10px; padding-top: 7px; border-top: 1px solid var(--ink); box-shadow: 0 -3px 0 -2px var(--ink);
    font: 600 10px var(--sans); letter-spacing: .26em; text-transform: uppercase; color: var(--ink2); display: inline-block; }

  /* Priority and remote toggle */
  .remote { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 10px; background: var(--card);
    border: 1px solid var(--rule); border-radius: var(--r); font: 500 12px var(--sans); color: var(--ink2); }
  .remote .box { width: 13px; height: 13px; border: 1.2px solid var(--ink); border-radius: 2px; display: grid; place-items: center; }
  .remote[aria-pressed="true"] { color: var(--ink); }
  .remote[aria-pressed="true"] .box::after { content: ""; width: 7px; height: 7px; background: var(--ink); border-radius: 1px; }

  /* Best trips */
  #trips { position: absolute; left: 30px; top: 132px; width: 252px; display: grid; gap: 6px; }
  #trips .eyebrow { margin: 0 0 2px 2px; }
  .trip { all: unset; position: relative; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; padding: 8px 12px 9px;
    background: var(--card); border: 1px solid var(--rule); border-radius: var(--r); }
  .trip:hover { border-color: rgba(29, 42, 74, .45); }
  .trip[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 .5px var(--ink); }
  .trip .when { font: 600 13.5px var(--serif); }
  .trip .when span { color: var(--muted); font-weight: 400; margin: 0 4px; }
  .trip .p { font: 600 13.5px var(--serif); text-align: right; }
  .trip .mini { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; }

  /* Shared glyphs: hour blocks (work lost) and moment dots (Junction attended). */
  .hours { display: flex; gap: 4px; }
  .hours .day { display: grid; grid-template-columns: repeat(8, 1fr); gap: 1px; width: 34px; }
  .hours i { height: 6px; background: var(--rule2); border-radius: 1px; }
  .hours i.lost { background: var(--red); }
  .moments { display: flex; gap: 3.5px; }
  .moments i { width: 6px; height: 6px; transform: rotate(45deg); background: var(--ink); }
  .moments i.off { background: transparent; box-shadow: inset 0 0 0 1.1px var(--red); }
  .big .hours .day { width: 31px; gap: 1px; } .big .hours i { height: 9px; }
  .big .moments { gap: 7px; } .big .moments i { width: 8px; height: 8px; }

  /* Postcard */
  .postcard { right: 30px; top: 272px; width: 440px; height: 214px; transform: rotate(-.6deg);
    display: grid; grid-template-columns: 1fr 1px 168px; padding: 18px 20px; gap: 0 16px; }
  .postcard .rule { background: var(--rule2); }
  .postcard .price { font: 600 34px/1.1 var(--serif); margin: 4px 0 8px; }
  .postcard .leg { display: grid; grid-template-columns: 38px 1fr; font-size: 12px; color: var(--ink2); line-height: 1.6; }
  .postcard .leg b { font: 600 9.5px var(--sans); letter-spacing: .16em; text-transform: uppercase; padding-top: 3px; color: var(--red); }
  .postcard .leg em { font: italic 400 13.5px var(--serif); color: var(--ink); }
  .meters { display: grid; gap: 9px; margin-top: 12px; }
  .meter { display: grid; grid-template-columns: 58px 1fr 52px; align-items: center; font-size: 11px; color: var(--ink2); }
  .meter > span:last-child { text-align: right; color: var(--ink); font-weight: 600; }
  .addr { display: flex; flex-direction: column; }
  .addr .stampbox { height: 96px; }
  .addr .lines { margin-top: auto; font: 500 21px/1 var(--hand); color: var(--ink); }
  .addr .lines div { border-bottom: 1px solid var(--rule2); padding: 6px 0 2px; }

  /* Ledger */
  .ledger { left: 30px; right: 30px; bottom: 20px; height: 270px; padding: 14px 18px 8px; }
  .ledger svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .lrow { cursor: pointer; }

  /* Order: a stamp-red button under the postcard, and a checkout sheet in the same paper style. */
  .book { all: unset; position: absolute; right: 30px; top: 500px; z-index: 10; cursor: pointer; display: flex; align-items: center; gap: 12px;
    padding: 11px 16px 11px 18px; background: var(--red); color: #fbf6ec; border-radius: var(--r); font: 600 13.5px var(--sans); letter-spacing: .02em;
    box-shadow: 0 1px 0 rgba(0,0,0,.05), 0 12px 24px -14px rgba(120,30,20,.8); transform: rotate(-.6deg); }
  .book:hover { background: #a42b24; }
  .book b { font: 600 15px var(--serif); padding-left: 12px; border-left: 1px solid rgba(255,255,255,.35); }
  .book kbd { font: 600 10px var(--sans); opacity: .6; }
  .sheetbg { position: fixed; inset: 0; z-index: 30; background: rgba(29,42,74,.28); display: grid; place-items: center; }
  .sheetbg[hidden] { display: none; }
 .checkout .agent .paid { all: unset; cursor: pointer; margin-top: 8px; padding: 9px 14px; border-radius: var(--r); font: 600 12.5px var(--sans); text-align: center; background: #2f6b3a; color: var(--card); }
 .checkout .agent .paid:hover { background: #255830; } .checkout .agent .paid[disabled] { opacity: .55; cursor: default; }
 .book.busy b, .book.busy kbd { display: none; } .book.pay { background: #2f6b3a; } .book.pay:hover { background: #255830; }
 .agent .paidnote { margin: 0; font-size: 12px; color: var(--muted); margin-top: 6px; }
 .agent .booked b { color: #2f6b3a; }
  .checkout { position: relative; width: 560px; padding: 26px 28px 22px; }
  .checkout h2 { margin: 2px 0 4px; font: 700 26px/1.15 var(--serif); }
  .checkout .sub { color: var(--ink2); font-size: 12.5px; }
  .ticket { display: grid; grid-template-columns: 54px 1fr auto; gap: 2px 14px; align-items: center; padding: 14px 0; border-top: 1px dashed var(--rule); }
  .ticket:first-of-type { margin-top: 16px; }
  .ticket .dir { font: 600 9.5px var(--sans); letter-spacing: .16em; color: var(--red); grid-row: span 2; }
  .ticket .main { font: italic 400 16px var(--serif); }
  .ticket .meta { font-size: 12px; color: var(--ink2); }
  .ticket .price { font: 600 17px var(--serif); text-align: right; grid-row: span 2; }
  .ticket a { color: var(--ink2); font-size: 11.5px; }
  .checkout .total { display: flex; justify-content: space-between; padding: 12px 0 4px; border-top: 1px solid var(--ink); box-shadow: 0 -3px 0 -2px var(--ink); font: 600 15px var(--serif); }
  .checkout .note { margin: 10px 0 16px; font-size: 12px; color: var(--ink2); line-height: 1.5; }
  .checkout .acts { display: flex; gap: 10px; justify-content: flex-end; }
  .checkout .acts button { all: unset; cursor: pointer; padding: 9px 14px; border-radius: var(--r); font: 600 12.5px var(--sans); }
  .checkout .acts .go { background: var(--ink); color: var(--card); } .checkout .go:hover { background: #2a3a63; }
  .checkout .acts .ghost { border: 1px solid var(--rule); color: var(--ink2); } .checkout .ghost:hover { color: var(--ink); }
  .tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--card); font-size: 11.5px; padding: 7px 10px; border-radius: var(--r);
    white-space: nowrap; opacity: 0; transition: opacity .12s; z-index: 20; line-height: 1.5; }
  .tip b { font-weight: 600; }

  /* v13: the airmail border is an overlay, so it can ease in on load and fold away at globe zoom without resizing the map. */
  .frame { padding: 0; background: var(--paper); }
  .sheet { position: absolute; inset: 0; height: auto; border-radius: 0; }
  .stripes { position: absolute; inset: 0; padding: 10px; pointer-events: none; z-index: 15;
    background: repeating-linear-gradient(-45deg, var(--red) 0 16px, var(--paper) 16px 24px, var(--ink) 24px 40px, var(--paper) 40px 48px);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
    transition: padding .9s cubic-bezier(.22, 1, .36, 1), opacity .7s ease;
  }
  .stripes.bare { padding: 0; opacity: 0; }

  /* Intro: the camera zooms in from the globe, then the HUD settles in, one piece after another. */
  .title, .leftcol, .ledger { transition: opacity .9s cubic-bezier(.22, 1, .36, 1) var(--d, 0s), translate 1.1s cubic-bezier(.22, 1, .36, 1) var(--d, 0s); }
  .title { --d: 0s; } .leftcol { --d: .25s; } .ledger { --d: .5s; }
  body.intro .title { opacity: 0; translate: 0 -16px; }
  body.intro .leftcol { opacity: 0; translate: -22px 0; }
  body.intro .ledger { opacity: 0; translate: 0 28px; }
  .leftcol .trip { transition: opacity .7s ease calc(.35s + var(--i, 0) * 70ms), translate .9s cubic-bezier(.22, 1, .36, 1) calc(.35s + var(--i, 0) * 70ms), border-color .15s; }
  body.intro .leftcol .trip { opacity: 0; translate: -14px 0; }
  @media (prefers-reduced-motion: reduce) { .title, .leftcol, .postcard, .ledger, .leftcol .trip, .stripes { transition: none !important; } }


  /* Left column: best trips, then the map reset. */
  .leftcol { position: absolute; left: 30px; top: 132px; width: 252px; z-index: 10; display: grid; gap: 12px; }
  .leftcol #trips { position: static; width: auto; }
  .leftcol .reset { position: static; justify-self: start; }
  .trip .tag { font: 600 8px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--red); border: 1px solid currentColor; border-radius: 2px; padding: 0 3px; margin-right: 6px; vertical-align: 2px; }
  .postcard .price small { display: block; font: 500 11px var(--sans); color: var(--ink2); letter-spacing: 0; margin-top: 2px; }
  /* The book button is the postcard's foot: a red airmail band across the card. */
  .postcard { height: auto; padding-bottom: 0; grid-template-columns: minmax(0, 1fr) 1px 156px; }
  .postcard .book { position: relative; top: auto; right: auto; grid-column: 1 / -1; margin: 16px -20px 0; padding: 12px 20px; transform: none;
    border-radius: 0 0 var(--r) var(--r); box-shadow: none; justify-content: flex-start; gap: 14px; }
  .postcard .book span { flex: 1; }
  .postcard .book::before { content: ""; position: absolute; left: 0; right: 0; top: -5px; height: 5px;
    background: repeating-linear-gradient(-45deg, var(--red) 0 8px, transparent 8px 12px, var(--ink) 12px 20px, transparent 20px 24px); opacity: .9; }
  .trip .tag { position: absolute; top: -7px; right: 10px; background: var(--card); margin: 0; }

  /* Bottom panel: folder tabs over one card, four views. */
  .ledger { height: 290px; }
  .tabs { position: absolute; left: 14px; top: -27px; display: flex; gap: 3px; }
  .tabs button { all: unset; cursor: pointer; padding: 6px 13px 7px; font: 600 10px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
    background: var(--paper); border: 1px solid var(--rule); border-bottom: 0; border-radius: 4px 4px 0 0; }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-pressed="true"] { background: var(--card); color: var(--ink); position: relative; top: 1px; padding-bottom: 7px; }
  .tabs kbd { font: 600 9px var(--sans); color: var(--muted); margin-left: 8px; letter-spacing: 0; }
  .view.off { display: none !important; }
  #v-trade { width: 100%; height: 100%; display: block; overflow: visible; }
  #v-sellers { height: 100%; display: grid; grid-template-rows: auto 1fr; }
  #v-sellers .head { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); padding: 0 0 6px; border-bottom: 1px solid var(--rule2); }
  #v-sellers .rows { display: grid; align-content: start; }
  .srow { display: grid; grid-template-columns: 150px 1fr 330px; gap: 18px; align-items: center; padding: 4px 0; border-bottom: 1px dashed var(--rule2); }
  .srow .who b { display: block; font: 600 9.5px var(--sans); letter-spacing: .16em; color: var(--red); }
  .srow .who em { font: italic 400 14px var(--serif); color: var(--ink); }
  .srow .who span { display: block; font-size: 11px; color: var(--ink2); }
  .srow svg { width: 100%; height: 76px; overflow: visible; }
  .srow .why { font-size: 11.5px; line-height: 1.45; color: var(--ink2); }
  .srow .why b { color: var(--ink); font-weight: 600; }
  #v-story { height: 100%; display: grid; grid-template-rows: 1fr auto; }
  .stations { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; align-items: start; padding-top: 38px; }
  .stations::before { content: ""; position: absolute; left: 0; right: 0; top: 49px; border-top: 1.5px solid var(--ink); }
  .st { position: relative; padding: 22px 8px 0 0; }
  .st::before { content: ""; position: absolute; left: 0; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--card); border: 1.5px solid var(--ink); }
  .st.fly::before { background: var(--red); border-color: var(--red); }
  .st.warn::before { background: var(--card); border-color: var(--red); box-shadow: 0 0 0 3px rgba(184, 50, 42, .18); }
  .st .gap { position: absolute; left: 14px; top: -14px; font: 600 9px var(--sans); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; white-space: nowrap; }
  .st .day { font: 600 9px var(--sans); letter-spacing: .16em; color: var(--muted); }
  .st .tm { font: 600 21px/1.1 var(--serif); color: var(--ink); }
  .st .tz { font: 500 9px var(--sans); color: var(--muted); margin-left: 3px; }
  .st .ti { font: italic 400 13px/1.25 var(--serif); color: var(--ink); margin-top: 3px; }
  .st .sb { font-size: 11px; color: var(--ink2); margin-top: 2px; line-height: 1.35; }
  .st.event { background: repeating-linear-gradient(-45deg, rgba(184, 50, 42, .07) 0 3px, transparent 3px 6px); margin-top: -8px; padding-top: 30px; }
  #v-story .foot { display: flex; gap: 22px; font-size: 11.5px; color: var(--ink2); border-top: 1px solid var(--rule2); padding-top: 7px; }
  #v-story .foot b { color: var(--ink); }
  .checkout .agent { margin: 0 0 14px; padding: 10px 12px; border: 1px dashed var(--rule); border-radius: var(--r); display: grid; gap: 5px; font-size: 12px; }
  .checkout .agent div { display: grid; grid-template-columns: 130px 1fr auto; gap: 10px; color: var(--ink2); }
  .checkout .agent b { font-weight: 600; color: var(--ink); }
  .checkout .agent div:last-child b { color: var(--red); }
  .checkout .agent div:last-child b::before { content: "● "; animation: blink 1.2s ease-in-out infinite; }
  .checkout .agent div.done:last-child b::before, .checkout .agent div.failed:last-child b::before { animation: none; }
  .checkout .agent i { font-style: normal; color: var(--muted); font-size: 11px; }
  .checkout .acts .go[disabled] { opacity: .55; cursor: default; }
  @keyframes blink { 50% { opacity: .25; } }
  .postcard .pick { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; margin: -2px 0 10px; }
  .postcard .pick .eyebrow { margin: 0; flex: 1; }
  .postcard .dots { display: flex; gap: 6px; }
  .postcard .dots button { all: unset; cursor: pointer; width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1.2px var(--muted); transition: background .2s, box-shadow .2s; }
  .postcard .dots button:hover { box-shadow: inset 0 0 0 1.2px var(--ink); }
  .postcard .dots button[aria-pressed="true"] { background: var(--red); box-shadow: none; }
  .postcard .step { all: unset; cursor: pointer; width: 24px; height: 24px; display: grid; place-items: center; border-radius: var(--r); color: var(--ink2); }
  .postcard .step:hover { background: rgba(29,42,74,.06); color: var(--ink); }
  .postcard .step[disabled] { opacity: .3; cursor: default; background: none; }
  .postcard svg path { fill: none; stroke: currentColor; stroke-width: 1.5; }
  .postcard .step svg { width: 11px; height: 11px; }
  .postcard .book { margin-top: 12px; }
  .crow2 { display: grid; grid-template-columns: 72px 1fr; align-items: center; gap: 10px; }
  .clbl2 { font: 600 9px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .seg2 { display: flex; gap: 2px; padding: 2px; border-radius: var(--r); background: rgba(29,42,74,.06); }
  .seg2 button { all: unset; cursor: pointer; flex: 1; text-align: center; padding: 6px 0; border-radius: 3px; font: 500 12px var(--sans); color: var(--ink2); transition: background .15s, color .15s; }
  .seg2 button:hover { color: var(--ink); }
  .seg2 button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(29,42,74,.18); }
  .chelp2 { margin: 5px 0 12px 82px; font-size: 11.5px; line-height: 1.45; color: var(--ink2); min-height: 17px; }
  .crow2.sw { grid-template-columns: 72px 1fr auto; cursor: pointer; }
  .swl { font-size: 12.5px; color: var(--ink); }
  .switch { all: unset; cursor: pointer; width: 30px; height: 18px; border-radius: 9px; background: rgba(29,42,74,.2); position: relative; transition: background .2s; }
  .switch i { position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: translate .2s cubic-bezier(.22,1,.36,1); }
  .switch[aria-checked="true"] { background: var(--ink); } .switch[aria-checked="true"] i { translate: 12px 0; }

  /* ===== v17: one card. Step 1 previews the trip; step 2 opens the card to choose and book the tickets. ===== */
  .hc { position: absolute; right: 30px; bottom: 30px; width: 440px; z-index: 10; display: grid; grid-template-columns: minmax(0, 1fr) auto 440px;
    transform: rotate(-.6deg); --d: .35s;
    transition: opacity .9s cubic-bezier(.22, 1, .36, 1) var(--d), translate 1.1s cubic-bezier(.22, 1, .36, 1) var(--d), transform .5s cubic-bezier(.22, 1, .36, 1); }
  body.intro .hc { opacity: 0; translate: 22px 0; }
  .hc.open { width: calc(100% - 60px); height: 404px; transform: none; }
  .hc > .details, .hc > .vrule { display: none; }
  .hc.open > .details { display: grid; }
  .hc.open > .vrule { display: block; width: 1px; background: var(--rule2); margin: 20px 0 22px; }
  .hc .postcard { grid-column: 3; position: relative; inset: auto; width: auto; height: auto; transform: none; border: 0; border-radius: 0; box-shadow: none; background: none; }
  .postcard .info .eyebrow { display: block; margin-top: 2px; }
  .postcard .info .price { margin-top: 2px; }
  .postcard .ctl { display: none; grid-column: 1 / -1; }
  /* Steps: where you are, and what comes next. */
  .steps { flex: 1; display: flex; align-items: center; gap: 8px; }
  .stp { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; font: 600 9.5px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); transition: color .15s; }
  .stp i { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font: 600 9px/1 var(--sans); font-style: normal; letter-spacing: 0;
    box-shadow: inset 0 0 0 1.2px currentColor; transition: background .2s, color .2s, box-shadow .2s; }
  .stp:hover { color: var(--ink); }
  .stp[aria-current="step"] { color: var(--ink); cursor: default; }
  .stp[aria-current="step"] i { background: var(--ink); color: var(--card); box-shadow: none; }
  .steps .ln { width: 16px; height: 1px; background: var(--rule); }
  /* Step 2: the postcard keeps its place and size; it trades the meters for the choices, and the details open to its left. */
  .hc.open .postcard { height: 100%; grid-template-rows: auto auto auto 1fr; }
  .hc.open .postcard .ctl { display: block; margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--rule); }
  .hc.open .postcard .book { align-self: end; border-bottom-left-radius: 0; }
  .book .arr { width: 14px; height: 14px; }
  .book .arr path { fill: none; stroke: currentColor; stroke-width: 1.6; }
  .details { grid-column: 1; min-width: 0; overflow: hidden; grid-template-rows: auto minmax(0, 1fr); padding: 16px 20px 16px 24px; }
  .dhead { display: flex; align-items: center; gap: 12px; margin: -2px 0 10px; }
  .details .tabs { position: static; flex: 1; display: flex; gap: 22px; border-bottom: 1px solid var(--rule2); }
  .details .tabs button { all: unset; cursor: pointer; padding: 6px 0 7px; margin-bottom: -1px; border-bottom: 1.5px solid transparent;
    font: 600 9.5px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); transition: color .15s, border-color .15s; }
  .details .tabs button:hover { color: var(--ink2); }
  .details .tabs button[aria-pressed="true"] { color: var(--ink); border-color: var(--red); }
  .close2 { all: unset; cursor: pointer; width: 26px; height: 26px; display: grid; place-items: center; border-radius: var(--r); color: var(--ink2); }
  .close2:hover { background: rgba(29, 42, 74, .06); color: var(--ink); }
  .close2 svg { width: 11px; height: 11px; } .close2 path { fill: none; stroke: currentColor; stroke-width: 1.5; }
  .views { position: relative; min-height: 0; }
  .views > .view { position: absolute; inset: 0; width: 100%; height: 100%; }
  @media (prefers-reduced-motion: reduce) { .hc { transition: none; } }
  /* v18: the postcard stays whole in step 2; the choices are chips under it. */
  .hc.open { height: 420px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips + .chips { margin-top: 8px; }
  .chip2 { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--r);
    box-shadow: inset 0 0 0 1px var(--rule2); font: 500 12px var(--sans); color: var(--ink2); transition: background .15s, color .15s, box-shadow .15s; }
  .chip2:hover { color: var(--ink); box-shadow: inset 0 0 0 1px var(--rule); }
  .chip2[aria-pressed="true"], .chip2[aria-checked="true"] { background: rgba(29, 42, 74, .07); color: var(--ink); font-weight: 600; box-shadow: inset 0 0 0 1px var(--ink); }
  .chips .sep { width: 1px; margin: 4px 4px; background: var(--rule2); }
  .chip2 .box { width: 10px; height: 10px; border-radius: 2px; box-shadow: inset 0 0 0 1.2px currentColor; display: grid; place-items: center; }
  .chip2[aria-checked="true"] .box { background: var(--ink); box-shadow: none; }
  .chip2[aria-checked="true"] .box::after { content: ""; width: 5px; height: 3px; border: solid var(--card); border-width: 0 0 1.4px 1.4px; rotate: -45deg; translate: 0 -1px; }
  /* Zoomed out to the globe: the HUD steps aside. A click on the globe flies back to the route. */
  body.far .hc, body.far .title { opacity: 0; translate: 0 18px; pointer-events: none; transition-delay: 0s; }
  body.far .hc { transition: opacity .35s, translate .5s cubic-bezier(.22, 1, .36, 1); }
  body.far #map { cursor: pointer; }

</style>
</head>
<body class="intro">
<div class="frame"><div class="sheet">
  <div id="map"></div>
  <div class="title halo"><h1 id="t-h1"></h1><div class="sub" id="t-sub"></div></div>
  <div class="card hc" id="hc">
    <div class="details" id="panel">
      <div class="dhead"><div class="tabs" id="tabs"></div><button class="close2" id="close2" title="Back to the preview"><svg viewBox="0 0 10 10"><path d="M1.5 3.5 5 7l3.5-3.5"/></svg></button></div>
      <div class="views"><svg id="ledger" class="view" data-v="timeline"></svg><svg id="v-trade" class="view off" data-v="trade"></svg>
        <div id="v-sellers" class="view off" data-v="sellers"></div><div id="v-story" class="view off" data-v="story"></div></div>
    </div>
    <div class="vrule"></div>
    <div class="postcard" id="postcard"></div>
  </div>
</div><div class="stripes" id="stripes"></div></div>
<div class="tip" id="tip"></div>
<div class="sheetbg" id="sheetbg" hidden><div class="card checkout" id="checkout" role="dialog" aria-modal="true" aria-label="Book these flights"></div></div>

<script>
// Load the trip, then the app. ?trip=<url> picks another trip file; the default is trip.json beside this page.
(async () => {
  const src = new URLSearchParams(location.search).get('trip') || 'trip.json';
  try {
    const r = await fetch(src, { cache: 'no-store' });
    if (!r.ok) throw new Error(`${src}: HTTP ${r.status}`);
    window.TRIP = await r.json();
  } catch (e) {
    document.getElementById('t-h1').textContent = 'No trip to show';
    document.getElementById('t-sub').textContent = String(e.message || e);
    document.body.classList.remove('intro');
    return;
  }
  document.title = window.TRIP.title;
  document.getElementById('t-h1').textContent = window.TRIP.title;
  document.getElementById('t-sub').textContent = window.TRIP.subtitle || '';
  const s = document.createElement('script'); s.src = 'app.js'; document.body.append(s);
})();
</script>
</body>
</html>
